<div class="flex h-screen bg-[#0e0e0e] text-[#e5e2e1] font-body overflow-hidden">

  <!-- Mobile overlay -->
  <div *ngIf="sidebarOpen"
       class="fixed inset-0 bg-black/60 z-40 lg:hidden"
       (click)="toggleSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="h-screen w-72 flex flex-col fixed left-0 top-0 bg-neutral-950 z-50 border-r border-[#4d463a]/15 transition-transform duration-300"
         [class.-translate-x-full]="!sidebarOpen"
         [class.translate-x-0]="sidebarOpen"
         [class.lg:translate-x-0]="true">

    <!-- Brand -->
    <div class="py-8 px-6 flex-shrink-0">
      <h1 class="font-headline text-xl text-primary italic tracking-tight">SmartRestaurant</h1>
      <p class="font-label text-[10px] uppercase tracking-[0.2em] text-[#998f81]/60 mt-1">Admin Management</p>
    </div>

    <!-- Nav -->
    <nav class="flex-1 overflow-y-auto px-4 space-y-0.5 pb-4">
      <a *ngFor="let item of navItems"
         [routerLink]="item.route"
         class="flex items-center gap-3 px-4 py-3 text-sm transition-colors cursor-pointer rounded-sm"
         [class.text-primary]="isActive(item.route)"
         [class.border-l-2]="isActive(item.route)"
         [class.border-primary]="isActive(item.route)"
         [class.bg-neutral-900]="isActive(item.route)"
         [class.text-[#998f81]]="!isActive(item.route)"
         [class.hover:text-[#e5e2e1]]="!isActive(item.route)"
         [class.hover:bg-neutral-900]="!isActive(item.route)">
        <span class="material-symbols-outlined text-[20px]">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>

      <div class="pt-4 pb-2 px-4 font-label text-[10px] uppercase tracking-widest text-[#998f81]/40 font-bold">
        Configuración
      </div>

      <a *ngFor="let item of configItems"
         [routerLink]="item.route"
         class="flex items-center gap-3 px-4 py-3 text-sm transition-colors cursor-pointer rounded-sm"
         [class.text-primary]="isActive(item.route)"
         [class.border-l-2]="isActive(item.route)"
         [class.border-primary]="isActive(item.route)"
         [class.bg-neutral-900]="isActive(item.route)"
         [class.text-[#998f81]]="!isActive(item.route)"
         [class.hover:text-[#e5e2e1]]="!isActive(item.route)"
         [class.hover:bg-neutral-900]="!isActive(item.route)">
        <span class="material-symbols-outlined text-[20px]">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <!-- User footer -->
    <div class="p-6 border-t border-[#4d463a]/10 flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-[#201f1f] border border-[#4d463a]/30 flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-primary text-base">person</span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-body text-sm font-medium text-[#e5e2e1] truncate">
            {{ currentUser?.firstName }} {{ currentUser?.lastName }}
          </p>
          <button (click)="logout()"
                  class="font-label text-[10px] uppercase tracking-widest text-[#998f81] hover:text-primary transition-colors">
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col lg:ml-72 min-w-0">

    <!-- TOP BAR -->
    <header class="flex justify-between items-center px-6 md:px-8 h-20 flex-shrink-0 bg-neutral-950/60 backdrop-blur-xl border-b border-[#4d463a]/10 sticky top-0 z-30">
      <div class="flex items-center gap-4">
        <!-- Mobile hamburger -->
        <button class="lg:hidden text-[#998f81] hover:text-primary transition-colors"
                (click)="toggleSidebar()">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h2 class="font-headline text-lg font-light text-primary hidden md:block">Panel de Administración</h2>
      </div>

      <div class="flex items-center gap-3 text-[#998f81]">
        <button [routerLink]="'/admin/inventory/alerts'"
                class="hover:text-primary transition-colors relative" title="Alertas de stock">
          <span class="material-symbols-outlined">notifications</span>
          <span class="absolute top-0 right-0 w-2 h-2 bg-primary rounded-full"></span>
        </button>
        <div class="h-6 w-px bg-[#4d463a]/30"></div>
        <!-- Profile button with name -->
        <button [routerLink]="'/auth/profile'"
                class="flex items-center gap-2.5 hover:text-primary transition-colors group">
          <div class="w-8 h-8 rounded-full bg-[#201f1f] border border-[#4d463a]/30 flex items-center justify-center flex-shrink-0">
            <span class="font-label text-[10px] text-primary font-bold uppercase">
              {{ currentUser?.firstName?.charAt(0) }}{{ currentUser?.lastName?.charAt(0) }}
            </span>
          </div>
          <div class="hidden md:block text-left">
            <p class="font-body text-xs text-[#e5e2e1] group-hover:text-primary transition-colors leading-tight">
              {{ currentUser?.firstName }} {{ currentUser?.lastName }}
            </p>
            <p class="font-label text-[9px] uppercase tracking-widest text-[#998f81]">Mi perfil</p>
          </div>
        </button>
        <div class="h-6 w-px bg-[#4d463a]/30"></div>
        <button (click)="logout()"
                class="btn-metallic text-on-primary font-label text-xs uppercase tracking-widest px-4 py-2 rounded-md hover:opacity-90 transition-all flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">logout</span>
          <span class="hidden md:inline">Salir</span>
        </button>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="flex-1 overflow-y-auto min-h-0">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
