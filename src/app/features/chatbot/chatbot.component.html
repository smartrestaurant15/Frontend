<!-- Botón flotante -->
<button class="chat-fab" (click)="toggleChat()" [class.open]="isOpen" aria-label="Abrir chatbot">
  <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
</button>

<!-- Panel de chat -->
<div class="chat-panel" [class.visible]="isOpen">

  <div class="chat-header">
    <div class="header-info">
      <div class="bot-avatar">🍽️</div>
      <div>
        <p class="bot-name">Asistente Smart</p>
        <p class="bot-status">Consulta nuestro menú</p>
      </div>
    </div>
  </div>

  <div class="chat-messages" #messagesContainer>
    <div *ngFor="let msg of messages" class="message" [class.user]="msg.from === 'user'" [class.bot]="msg.from === 'bot'">

      <!-- Burbuja de texto -->
      <div class="bubble" [class.loading]="msg.loading" *ngIf="msg.text || msg.loading">
        <span *ngIf="!msg.loading">{{ msg.text }}</span>
        <span *ngIf="msg.loading" class="dots"><span></span><span></span><span></span></span>
      </div>

      <!-- Tarjetas de platos -->
      <div *ngIf="msg.dishes && msg.dishes.length > 0" class="dish-results">
        <div *ngFor="let dish of msg.dishes" class="dish-card" (click)="askIngredients(dish)">
          <img *ngIf="dish.photo" [src]="dish.photo" [alt]="dish.name" class="dish-img" />
          <div class="dish-info">
            <p class="dish-name">{{ dish.name }}</p>
            <p class="dish-price">${{ dish.price | number:'1.0-0' }}</p>
          </div>
          <span class="dish-hint">🥗</span>
        </div>
      </div>

      <!-- Chips de ingredientes -->
      <div *ngIf="msg.ingredients && msg.ingredients.length > 0" class="ingredient-list">
        <span *ngFor="let ing of msg.ingredients" class="ingredient-chip">{{ ing }}</span>
      </div>

      <!-- Botones de sugerencia -->
      <div *ngIf="msg.suggestions && msg.suggestions.length > 0 && !loading" class="suggestions">
        <button *ngFor="let s of msg.suggestions" class="suggestion-btn" (click)="selectSuggestion(s)">
          {{ s }}
        </button>
      </div>

    </div>
  </div>

  <div class="chat-input">
    <input
      type="text"
      [(ngModel)]="inputText"
      (keydown.enter)="sendMessage()"
      [placeholder]="currentIntent === 'awaiting_search' ? 'Escribe el nombre del plato…' :
                     currentIntent === 'awaiting_category' ? 'Escribe la categoría…' :
                     currentIntent === 'awaiting_ingredients' ? 'Escribe el nombre del plato…' :
                     'Escribe aquí…'"
      [disabled]="loading"
    />
    <button (click)="sendMessage()" [disabled]="loading || !inputText.trim()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>

</div>
