<div class="min-h-screen bg-[#0a0a0a] text-[#e5e2e1] font-body px-8 py-8">

  <div class="flex items-center justify-between mb-8">
    <div>
      <p class="font-label text-[10px] uppercase tracking-widest text-[#998f81] mb-1">Organización</p>
      <h1 class="font-headline text-2xl italic text-[#e5e2e1]">Categorías</h1>
    </div>
    <button (click)="openCreateModal()" class="btn-metallic text-on-primary font-label text-[10px] font-bold uppercase tracking-widest px-5 py-2.5 rounded-sm flex items-center gap-2 hover:opacity-90 transition-all">
      <span class="material-symbols-outlined text-sm">add</span>Nueva Categoría
    </button>
  </div>

  <div *ngIf="loading" class="flex items-center justify-center h-32">
    <div class="w-6 h-6 border-2 border-[#4d463a] border-t-primary rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!loading && categories.length === 0" class="flex flex-col items-center justify-center h-48 text-[#998f81]/50">
    <span class="material-symbols-outlined text-4xl mb-3">category</span>
    <p class="font-body text-sm">No hay categorías registradas</p>
  </div>

  <div *ngIf="!loading && categories.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <div *ngFor="let category of categories"
         class="bg-[#111111] border border-[#4d463a]/15 p-6 hover:bg-[#1a1a1a] transition-colors group">
      <div class="flex items-start justify-between mb-4">
        <div class="w-10 h-10 bg-[#2a2a2a] rounded-sm flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-primary text-base">category</span>
        </div>
        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
          <button (click)="openEditModal(category.id)" class="p-1.5 text-[#998f81] hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-base">edit</span>
          </button>
          <button (click)="deleteCategory(category.id)" class="p-1.5 text-[#998f81] hover:text-red-400 transition-colors">
            <span class="material-symbols-outlined text-base">delete</span>
          </button>
        </div>
      </div>
      <h3 class="font-headline text-base font-semibold text-[#e5e2e1] mb-2">{{ category.name }}</h3>
      <p class="font-body text-xs text-[#998f81] leading-relaxed line-clamp-2">{{ category.description }}</p>
    </div>
  </div>
</div>

<app-category-form-modal
  [isOpen]="isModalOpen"
  [categoryId]="selectedCategoryId"
  (closeModal)="closeModal()"
  (categorySaved)="onCategorySaved()">
</app-category-form-modal>
