<div class="split-layout">
  <!-- Section Left: Image (Visible on desktop) -->
  <div class="image-section">
    <div class="overlay"></div>
    <div class="content-overlay">
      <h1>SmartRestaurant</h1>
      <p>Asegura tu cuenta y comienza a gestionar tu restaurante de forma inteligente.</p>
    </div>
  </div>

  <!-- Section Right: Form -->
  <div class="form-section">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Verificar Cuenta</h2>
        <p class="subtitle">Ingresa el codigo de verificacion enviado a tu correo</p>
      </div>

      <form [formGroup]="verifyForm" (ngSubmit)="onSubmit()">
        <app-form-field label="Correo Electronico" [required]="true">
          <input type="email" formControlName="email" placeholder="correo@ejemplo.com">
        </app-form-field>

        <app-form-field label="Codigo de Verificacion" [required]="true">
          <input type="text" formControlName="otp" placeholder="123456" maxlength="6">
        </app-form-field>

        <div class="form-actions">
          <app-button type="submit" variant="primary" [disabled]="verifyForm.invalid" [loading]="loading">
            Verificar
          </app-button>
        </div>
      </form>

      <div class="auth-footer">
        <a routerLink="/auth/login" class="back-link">
          <i class="fas fa-arrow-left"></i> Volver al inicio de sesion
        </a>
      </div>
    </div>
  </div>
</div>
