<div class="auth-wrapper">
  <!-- Left Side: Hero -->
  <div class="auth-hero">
    <div class="hero-content">
      <h1>Crea una Nueva<br>Seguridad</h1>
      <p>Ingresa el codigo que recibiste en tu correo y define tu nueva clave de acceso. Asegurate de que sea robusta
        para proteger tu negocio.</p>
    </div>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <!-- Right Side: Form -->
  <div class="auth-panel">
    <div class="auth-form-container">
      <div class="auth-header">
        <h2>Restablecer Clave</h2>
        <p class="subtitle">Ingresa el codigo recibido y tu nueva clave</p>
      </div>

      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
        <app-form-field label="Codigo de Recuperacion" [required]="true">
          <input type="text" formControlName="code" placeholder="123456" maxlength="6" autocomplete="one-time-code">
        </app-form-field>

        <app-form-field label="Nueva Clave" [required]="true">
          <input type="password" formControlName="newPassword" placeholder="********" autocomplete="new-password">
        </app-form-field>

        <app-form-field label="Confirmar Clave" [required]="true">
          <input type="password" formControlName="confirmPassword" placeholder="********" autocomplete="new-password">
        </app-form-field>

        <div class="form-actions">
          <app-button type="submit" variant="primary" [disabled]="resetPasswordForm.invalid" [loading]="loading"
            class="full-width">
            Actualizar Clave
          </app-button>
        </div>
      </form>

      <div class="auth-footer">
        <p><a routerLink="/auth/login">Cancelar y volver al inicio</a></p>
      </div>
    </div>
  </div>
</div>
