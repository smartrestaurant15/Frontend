<main class="flex min-h-screen bg-[#0e0e0e] text-[#e5e2e1] font-body overflow-hidden">

  <!-- LEFT: Atmospheric image -->
  <section class="relative hidden md:flex w-1/2 h-screen overflow-hidden">
    <div class="absolute inset-0 bg-[#0e0e0e]/60 z-10"></div>
    <img
      src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1200&q=80"
      alt="Restaurante de lujo"
      class="absolute inset-0 w-full h-full object-cover">

    <div class="relative z-20 flex flex-col items-center justify-center w-full h-full text-center px-12">
      <div class="space-y-4">
        <h1 class="font-headline text-5xl lg:text-6xl font-light tracking-tight text-primary italic uppercase">
          SmartRestaurant
        </h1>
        <div class="h-px w-24 bg-primary/40 mx-auto"></div>
        <p class="font-body tracking-[0.3em] text-[#d0c5b5] text-sm uppercase opacity-80">
          Acceso Seguro
        </p>
      </div>
    </div>

    <div class="absolute bottom-12 left-12 z-20">
      <p class="text-[10px] uppercase tracking-[0.4em] text-[#998f81]/40 -rotate-90 origin-left">EST. MMXXVI</p>
    </div>
  </section>

  <!-- RIGHT: Form -->
  <section class="w-full md:w-1/2 flex items-center justify-center bg-[#131313] px-8 md:px-24">
    <div class="w-full max-w-md">

      <!-- Mobile branding -->
      <div class="md:hidden mb-12 text-center">
        <h1 class="font-headline text-3xl font-light text-primary italic uppercase">SmartRestaurant</h1>
      </div>

      <!-- Header -->
      <div class="mb-10 space-y-3">
        <h2 class="font-headline text-3xl lg:text-4xl text-[#e5e2e1] font-light">
          Recuperar Contraseña
        </h2>
        <p class="text-[#d0c5b5] font-body text-sm leading-relaxed max-w-sm font-light">
          Introduce tu correo electrónico y te enviaremos un código para restablecer tu acceso.
        </p>
      </div>

      <!-- Form -->
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-8">

        <div class="group relative">
          <label for="email"
            class="block font-label text-[10px] uppercase tracking-widest text-[#998f81] mb-2 transition-colors group-focus-within:text-primary">
            Correo Electrónico
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="nombre@ejemplo.com"
            autocomplete="email"
            class="w-full bg-transparent border-0 border-b border-[#4d463a]/40 py-3 px-0 text-[#e5e2e1] placeholder:text-[#e5e2e1]/20 focus:outline-none focus:border-primary transition-all duration-300 font-light text-sm">
          <p *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
             class="mt-1 text-[10px] text-red-400 font-label uppercase tracking-widest">
            Correo inválido
          </p>
        </div>

        <!-- Submit -->
        <div class="pt-2">
          <button
            type="submit"
            [disabled]="forgotPasswordForm.invalid || loading"
            class="btn-metallic w-full py-4 px-6 rounded-md text-on-primary font-label text-xs font-bold tracking-widest uppercase hover:opacity-90 transition-all active:scale-[0.98] flex items-center justify-center gap-2 group disabled:opacity-50 disabled:cursor-not-allowed">
            <span *ngIf="!loading">
              Enviar Instrucciones
              <span class="material-symbols-outlined text-sm align-middle ml-1 group-hover:translate-x-1 transition-transform inline-block">arrow_forward</span>
            </span>
            <span *ngIf="loading" class="flex items-center gap-2">
              <span class="w-4 h-4 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin"></span>
              Enviando...
            </span>
          </button>
        </div>

        <!-- Back to login -->
        <div class="flex justify-center pt-4">
          <a routerLink="/auth/login"
             class="text-[#998f81] hover:text-primary text-xs uppercase tracking-widest transition-colors flex items-center gap-2 group">
            <span class="material-symbols-outlined text-base">arrow_back</span>
            <span class="border-b border-transparent group-hover:border-primary transition-all pb-0.5">
              Volver al inicio de sesión
            </span>
          </a>
        </div>

      </form>

      <!-- Footer detail -->
      <div class="mt-24 pt-8 border-t border-[#4d463a]/10">
        <div class="flex items-center justify-between text-[10px] text-[#998f81]/40 uppercase tracking-[0.2em]">
          <span>Acceso Seguro</span>
          <div class="flex gap-4">
            <a routerLink="/auth/terms" class="hover:text-primary transition-colors">Privacidad</a>
            <a routerLink="/auth/terms" class="hover:text-primary transition-colors">Legal</a>
          </div>
        </div>
      </div>

    </div>
  </section>

</main>
