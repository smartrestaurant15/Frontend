<div class="auth-wrapper">
  <!-- Left Side: Hero -->
  <div class="auth-hero">
    <div class="hero-content">
      <h1>Recupera tu<br>Acceso</h1>
      <p>No te preocupes, esto le pasa a cualquiera. Ingresa tu correo y te enviaremos un codigo para que vuelvas a
        gestionar tu restaurante en segundos.</p>
    </div>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <!-- Right Side: Form -->
  <div class="auth-panel">
    <div class="auth-form-container">
      <div class="auth-header">
        <h2>Recuperar Clave</h2>
        <p class="subtitle">Ingresa tu correo para recibir un codigo</p>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <app-form-field label="Correo Electronico" [required]="true">
          <input type="email" formControlName="email" placeholder="nombre@ejemplo.com" autocomplete="email">
        </app-form-field>

        <div class="form-actions">
          <app-button type="submit" variant="primary" [disabled]="forgotPasswordForm.invalid" [loading]="loading"
            class="full-width">
            Enviar Codigo
          </app-button>
        </div>
      </form>

      <div class="auth-footer">
        <p>¿Recordaste tu clave? <a routerLink="/auth/login">Volver al inicio de sesion</a></p>
      </div>
    </div>
  </div>
</div>
