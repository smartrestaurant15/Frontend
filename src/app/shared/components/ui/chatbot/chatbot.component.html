<!-- Floating Button -->
<button
  class="chat-fab"
  (click)="toggleChat()"
  [attr.aria-label]="isOpen ? 'Cerrar chat' : 'Abrir chat'"
  [class.is-open]="isOpen">
  <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
  </svg>
  <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
  </svg>
</button>

<!-- Chat Window -->
<div class="chat-window" [class.is-visible]="isOpen" [class.is-minimized]="isMinimized" role="dialog" aria-label="Chat del restaurante">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header__avatar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
    </div>
    <div class="chat-header__info">
      <span class="chat-header__name">Asistente Virtual</span>
      <span class="chat-header__status">
        <span class="status-dot"></span> En línea
      </span>
    </div>
    <div class="chat-header__actions">
      <button class="header-btn" (click)="minimizeChat()" title="Minimizar" aria-label="Minimizar chat">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 13H5v-2h14v2z"/>
        </svg>
      </button>
      <button class="header-btn header-btn--close" (click)="closeChat()" title="Cerrar" aria-label="Cerrar chat">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #messagesContainer>
    <div
      *ngFor="let msg of messages"
      class="message"
      [class.message--user]="msg.sender === 'user'"
      [class.message--bot]="msg.sender === 'bot'">
      <div class="message__bubble">{{ msg.text }}</div>
    </div>

    <!-- Typing indicator -->
    <div class="message message--bot" *ngIf="isLoading">
      <div class="message__bubble typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input">
    <input
      type="text"
      [(ngModel)]="inputText"
      (keydown)="onKeyDown($event)"
      [disabled]="isLoading"
      placeholder="Escribe un mensaje..."
      aria-label="Escribe tu mensaje"
      maxlength="500" />
    <button
      class="send-btn"
      (click)="sendMessage()"
      [disabled]="isLoading || !inputText.trim()"
      aria-label="Enviar mensaje">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>
