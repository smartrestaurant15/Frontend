<!-- Floating trigger -->
<button class="accessibility-trigger" (click)="toggleMenu()" aria-label="Opciones de accesibilidad">
  <span class="material-symbols-outlined">accessibility_new</span>
</button>

<!-- Panel -->
<div class="accessibility-panel" [class.show]="showMenu">
  <div class="acc-header">
    <span class="font-label text-[10px] uppercase tracking-widest text-[#c9a96e]">Accesibilidad</span>
    <button (click)="toggleMenu()" class="acc-close">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="acc-body">
    <!-- Font size -->
    <div class="acc-section">
      <p class="acc-label">Tamaño de fuente</p>
      <div class="acc-font-controls">
        <button (click)="changeFontSize(-2)" class="acc-font-btn">A−</button>
        <button (click)="resetAccessibility()" class="acc-font-btn acc-font-reset">Reset</button>
        <button (click)="changeFontSize(2)" class="acc-font-btn">A+</button>
      </div>
    </div>

    <!-- Toggles -->
    <button class="acc-toggle" [class.active]="highContrast" (click)="toggleHighContrast()">
      <span class="material-symbols-outlined">contrast</span>
      <span class="acc-toggle-label">Alto Contraste</span>
      <span class="acc-toggle-status">{{ highContrast ? 'ON' : 'OFF' }}</span>
    </button>

    <button class="acc-toggle" [class.active]="invertColors" (click)="toggleInvertColors()">
      <span class="material-symbols-outlined">invert_colors</span>
      <span class="acc-toggle-label">Invertir Colores</span>
      <span class="acc-toggle-status">{{ invertColors ? 'ON' : 'OFF' }}</span>
    </button>

    <button class="acc-toggle" [class.active]="underlineLinks" (click)="toggleUnderlineLinks()">
      <span class="material-symbols-outlined">format_underlined</span>
      <span class="acc-toggle-label">Subrayar Enlaces</span>
      <span class="acc-toggle-status">{{ underlineLinks ? 'ON' : 'OFF' }}</span>
    </button>

    <button class="acc-toggle" [class.active]="readableFont" (click)="toggleReadableFont()">
      <span class="material-symbols-outlined">text_fields</span>
      <span class="acc-toggle-label">Fuente Legible</span>
      <span class="acc-toggle-status">{{ readableFont ? 'ON' : 'OFF' }}</span>
    </button>
  </div>

  <div class="acc-footer">
    <button (click)="resetAccessibility()" class="acc-reset-all">
      <span class="material-symbols-outlined text-sm">restart_alt</span>
      Restaurar todo
    </button>
  </div>
</div>

<div class="acc-overlay" *ngIf="showMenu" (click)="toggleMenu()"></div>
