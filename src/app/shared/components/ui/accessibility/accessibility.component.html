<div class="accessibility-wrapper">
    <!-- Floating Button -->
    <button class="accessibility-trigger" (click)="toggleMenu()" aria-label="Opciones de accesibilidad">
        <img src="assets/images/accessibility.png" alt="Accesibilidad">
    </button>

    <!-- Accessibility Menu -->
    <div class="accessibility-menu" [class.show]="showMenu">
        <div class="menu-header">
            <h3>Opciones de Accesibilidad</h3>
            <button class="close-menu" (click)="toggleMenu()">&times;</button>
        </div>

        <div class="menu-body">
            <!-- Font Size Controls -->
            <div class="option-group">
                <label>Tamaño de Fuente</label>
                <div class="font-controls">
                    <button (click)="changeFontSize(-2)" title="Disminuir fuente">A-</button>
                    <button (click)="resetAccessibility()" title="Reiniciar">Reestablecer</button>
                    <button (click)="changeFontSize(2)" title="Aumentar fuente">A+</button>
                </div>
            </div>

            <!-- Toggles -->
            <div class="option-item" (click)="toggleHighContrast()" [class.active]="highContrast">
                <span class="icon">🌓</span>
                <span class="label">Alto Contraste</span>
                <span class="status">{{ highContrast ? 'Activado' : 'Desactivado' }}</span>
            </div>

            <div class="option-item" (click)="toggleInvertColors()" [class.active]="invertColors">
                <span class="icon">🔄</span>
                <span class="label">Invertir Colores</span>
                <span class="status">{{ invertColors ? 'Activado' : 'Desactivado' }}</span>
            </div>

            <div class="option-item" (click)="toggleUnderlineLinks()" [class.active]="underlineLinks">
                <span class="icon"><u>A</u></span>
                <span class="label">Subrayar Enlaces</span>
                <span class="status">{{ underlineLinks ? 'Activado' : 'Desactivado' }}</span>
            </div>

            <div class="option-item" (click)="toggleReadableFont()" [class.active]="readableFont">
                <span class="icon">🔡</span>
                <span class="label">Fuente Legible</span>
                <span class="status">{{ readableFont ? 'Activado' : 'Desactivado' }}</span>
            </div>
        </div>

        <div class="menu-footer">
            <button class="reset-all" (click)="resetAccessibility()">Restaurar todo</button>
        </div>
    </div>
</div>

<div class="menu-overlay" *ngIf="showMenu" (click)="toggleMenu()"></div>
